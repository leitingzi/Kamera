name: Deploy CameraK Web Demo

on:
  workflow_run:
    workflows:
      - Deploy Documentation
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github-pages-web-demo
  cancel-in-progress: false

jobs:
  deploy-web-demo:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check out published documentation
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/JS web demo
        run: ./gradlew --no-daemon :cameraK-web:jsBrowserDistribution

      - name: Add web demo to the published site
        run: |
          mkdir -p published-site/cameraK-web
          cp -R cameraK-web/build/dist/js/productionExecutable/. published-site/cameraK-web/

      - name: Deploy documentation and web demo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./published-site
