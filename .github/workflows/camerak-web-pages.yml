name: camerak-web-pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camerak-web-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: pip install --require-hashes -r docs/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the site
        run: mkdocs build --strict --site-dir site

      - name: Build and add CameraK Web
        run: |
          ./gradlew --no-daemon :cameraK-web:jsBrowserDistribution
          mkdir -p site/cameraK-web
          cp -R cameraK-web/build/dist/js/productionExecutable/. site/cameraK-web/
          touch site/.nojekyll
          test -s site/cameraK-web/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
